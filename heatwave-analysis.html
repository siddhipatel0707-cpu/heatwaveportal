        <h2>Heatwave Monitoring Report</h2>

        <script>
            let locationName = prompt("Enter location name:", "Goa");
            let currentTemp = parseFloat(prompt("Enter current temperature (°C):", "35"));
            let thresholdTemp = parseFloat(prompt("Enter heatwave threshold temperature (°C):", "32"));
            let humidity = parseFloat(prompt("Enter humidity (%):", "65"));
            let monitoringDate = prompt("Enter monitoring date (YYYY-MM-DD):", "2026-09-21");

            let tempDifference = currentTemp - thresholdTemp;

            let statusMessage = "";
            if (currentTemp > thresholdTemp) {
                statusMessage = "Heatwave Condition Detected";
            } else {
                statusMessage = "Normal Condition";
            }

            let htmlOutput = `
                <div class="report-card">
                    <strong>Location:</strong> ${locationName} <br>
                    <strong>Current Temperature:</strong> ${currentTemp}°C <br>
                    <strong>Heatwave Threshold:</strong> ${thresholdTemp}°C <br>
                    <strong>Temperature Difference:</strong> ${tempDifference}°C <br>
                    <strong>Status:</strong> <span style="color: ${currentTemp > thresholdTemp ? '#e53e3e' : '#38a169'}; font-weight: bold;">${statusMessage}</span>
                </div>
            `;

            let plainTextOutput = `Location: ${locationName}\n` +
                                  `Current Temperature: ${currentTemp}°C\n` +
                                  `Heatwave Threshold: ${thresholdTemp}°C\n` +
                                  `Temperature Difference: ${tempDifference}°C\n` +
                                  `Status: ${statusMessage}`;

            document.write(htmlOutput);

            console.log("--- Lab Task 1 Execution ---");
            console.log(plainTextOutput);

            alert("System Status Update: " + statusMessage);
        </script>
